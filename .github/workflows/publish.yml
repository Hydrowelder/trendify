name: "Publish"

on:
  push:
    branches: ["main"] # Run tests on every push to main
    tags: ["v*"] # Run tests AND publish on tags
  pull_request:
    branches: ["main"] # Run tests on PRs

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Parallelize tests across your supported versions
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only the coverage-badge commit below (3.14, push to main) needs
          # this; empty everywhere else so the deploy key is never loaded on
          # runs that don't push. It bypasses "PR required" and "signed
          # commits" on main by itself, instead of exempting a permission
          # tier like Write that every contributor would also get.
          ssh-key: ${{ (matrix.python-version == '3.14' && github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.COVERAGE_BADGE_DEPLOY_KEY || '' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Without a suffix every Python version shares one cache key, so the fastest job saves
          # it and the wheels built from source for 3.15 (numpy, matplotlib, ...) are never kept
          cache-suffix: ${{ matrix.python-version }}

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run unit tests
        # Explicitly tells uv which python version to use for the test environment;
        # --locked fails the job if uv.lock is out of date with pyproject.toml.
        # Always collects coverage (cheap on a test suite this size) so the
        # 3.14/push-to-main path below doesn't need a second, redundant run.
        run: uv run --locked --python ${{ matrix.python-version }} --group dev pytest --cov=trendify --cov-report=xml

      - name: Generate coverage badge
        if: matrix.python-version == '3.14' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run --locked --python ${{ matrix.python-version }} --group dev genbadge coverage -i coverage.xml -o docs/assets/coverage-badge.svg

      - name: Commit coverage badge
        if: matrix.python-version == '3.14' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # [skip ci]: a deploy-key push triggers workflows (a GITHUB_TOKEN push would not), and
          # the README and docs read the badge by its raw URL on main, so nothing needs a rerun
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: docs/assets/coverage-badge.svg

  publish:
    name: "Build and Publish"
    needs: [test]
    # ONLY run this job if the push was actually a tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # Required for PyPI Trusted Publishing
      contents: write # Required to create GitHub Release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fetch all history so we can see other branches
          fetch-depth: 0

      - name: Verify Tag is on Main
        # Only perform this check if we were triggered by a tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Check if 'main' branch contains the current commit
          if ! git branch -r --contains ${{ github.sha }} | grep -q "origin/main"; then
            echo "::error::Tag ${{ github.ref_name }} was pushed on a non-main branch. Skipping workflow."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
